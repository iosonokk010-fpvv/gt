<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BA Test</title>
<style>
body { background: #111; display: flex; flex-direction: column; align-items: center; padding: 40px; }

.ba-wrapper {
    position: relative;
    width: 800px;
    height: 450px;
    border-radius: 20px;
    overflow: hidden;
    background: #000;
    cursor: ew-resize;
    user-select: none;
    -webkit-user-select: none;
}
.ba-before, .ba-after {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none;
    display: block;
}
.ba-before {
    z-index: 1;
    background: linear-gradient(135deg, #1a1a3e 0%, #0f3460 100%);
}
.ba-after {
    z-index: 2;
    background: linear-gradient(135deg, #e94560 0%, #f5a623 100%);
}
.ba-divider {
    position: absolute;
    top: 0; left: 50%;
    width: 2px; height: 100%;
    background: white;
    z-index: 3;
    pointer-events: none;
}
.ba-handle {
    position: absolute;
    top: 50%; left: 50%;
    width: 44px; height: 44px;
    background: white;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #111;
    z-index: 4;
    pointer-events: none;
    margin-left: -22px;
    margin-top: -22px;
}
.ba-tag {
    position: absolute;
    top: 14px; z-index: 5;
    background: rgba(0,0,0,0.6);
    color: #fff; font-size: 11px;
    padding: 4px 12px; border-radius: 20px;
    pointer-events: none;
    font-family: sans-serif;
}
.ba-tag.left  { left: 14px; }
.ba-tag.right { right: 14px; }

#log {
    color: #0af; font-family: monospace; font-size: 13px;
    margin-top: 16px; text-align: center;
}
</style>
</head>
<body>

<div class="ba-wrapper" id="baWrapper1">
    <!-- 実際の動画はsrcを差し替え -->
    <video class="ba-before" id="vBefore" autoplay muted loop playsinline>
        <source src="aivideos/vfx_before_01.mp4" type="video/mp4">
    </video>
    <video class="ba-after" id="vAfter" autoplay muted loop playsinline>
        <source src="aivideos/vfx_after_01.mp4" type="video/mp4">
    </video>

    <div class="ba-divider" id="div1"></div>
    <div class="ba-handle"  id="hdl1">⇔</div>
    <span class="ba-tag left">BEFORE</span>
    <span class="ba-tag right">AFTER</span>
</div>

<p id="log">待機中</p>

<script>
(function() {
    var wrapper  = document.getElementById('baWrapper1');
    var after    = document.getElementById('vAfter');
    var divider  = document.getElementById('div1');
    var handle   = document.getElementById('hdl1');
    var log      = document.getElementById('log');
    var dragging = false;

    // 初期設定
    after.style.clipPath = 'inset(0 50% 0 0)';
    divider.style.left   = '50%';
    handle.style.left    = '50%';

    function setPos(clientX) {
        var rect = wrapper.getBoundingClientRect();
        var pct  = (clientX - rect.left) / rect.width;
        if (pct < 0.04) pct = 0.04;
        if (pct > 0.96) pct = 0.96;
        var p = pct * 100;

        after.style.clipPath = 'inset(0 ' + (100 - p) + '% 0 0)';
        divider.style.left   = p + '%';
        handle.style.left    = p + '%';
        log.textContent      = 'pos: ' + Math.round(p) + '% | clipPath: inset(0 ' + Math.round(100-p) + '% 0 0)';
    }

    wrapper.addEventListener('mousedown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        dragging = true;
        log.textContent = 'mousedown!';
        setPos(e.clientX);
    });

    document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        e.preventDefault();
        setPos(e.clientX);
    }, { passive: false });

    document.addEventListener('mouseup', function() {
        dragging = false;
    });

    wrapper.addEventListener('touchstart', function(e) {
        e.stopPropagation();
        dragging = true;
        setPos(e.touches[0].clientX);
    }, { passive: true });

    document.addEventListener('touchmove', function(e) {
        if (!dragging) return;
        setPos(e.touches[0].clientX);
    }, { passive: true });

    document.addEventListener('touchend', function() {
        dragging = false;
    });

    log.textContent = 'スクリプト初期化OK';
})();
</script>
</body>
</html>
